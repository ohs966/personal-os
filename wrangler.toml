# Personal OS on Cloudflare. Cloudflare Workers Builds deploys this on every push to main.
name = "personal-os"
main = "dist/worker.js"
no_bundle = true
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./docs"
binding = "ASSETS"
run_worker_first = ["/api/*", "/telegram"]

[[d1_databases]]
binding = "DB"
database_name = "personal-os-db"
database_id = "fb8e0354-a87c-4ac5-acc3-18d3c0a53385"
migrations_dir = "migrations"

[observability]
enabled = true
