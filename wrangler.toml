# Personal OS on Cloudflare. The GitHub Action fills in database_id at deploy time.
name = "personal-os"
main = "dist/worker.js"
no_bundle = true
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./docs"
binding = "ASSETS"
run_worker_first = ["/api/*", "/telegram"]

[[d1_databases]]
binding = "DB"
database_name = "personal-os-db"
database_id = "__D1_DATABASE_ID__"
migrations_dir = "migrations"

[observability]
enabled = true
